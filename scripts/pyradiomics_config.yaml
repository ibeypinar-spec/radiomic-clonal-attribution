# PyRadiomics Feature Extraction Config
# Modalite bagimsiz ozellikler — wavelet YOK
setting:
  binWidth: 25
  resampledPixelSpacing: [2, 2, 2]    # 2mm isotropic (1mm -> shape crash with large MRI masks)
  interpolator: sitkBSpline
  padDistance: 10
  weightingNorm:                        # normalize etme
  normalize: false
  normalizeScale: 1
  removeOutliers:
  label: 1                              # maske labeli (fallback: otomatik)
  minimumROIDimensions: 2
  minimumROISize:
  geometryTolerance: 1e-06
  correctMask: true                     # maske hataliysa onar

imageType:
  Original: {}                          # Sadece original — wavelet yok

featureClass:
  # shape: KALDIRILDI — buyuk MRI maskeleriyle ITK marching cubes crash yapiyor
  firstorder:                           # 18 ozellik
  glcm:                                 # 24 ozellik — doku homojenlik
  glrlm:                                # 16 ozellik — doku yonelimi
  glszm:                                # 16 ozellik — heterojenlik
  # Toplam: 74 ozellik — siniflandirma icin yeterli
  # gldzm, ngtdm, gldm: DISI BIRAKILIYOR
